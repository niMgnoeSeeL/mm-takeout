# Local Mattermost for browsing the Minerva archive.
# Pinned to the 11.7 line to match the server the data came from (11.7.7).
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser-password
      POSTGRES_DB: mattermost
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 30

  mattermost:
    image: mattermost/mattermost-team-edition:11.7.9
    # Mattermost only publishes amd64 images -- there is no arm64 build for any tag.
    # On Apple Silicon this runs under Rosetta emulation, which works but is slower.
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mmuser-password@postgres:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      # local mode = mmctl over a unix socket, so the import needs no admin login
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_LOCALMODESOCKETLOCATION: /var/tmp/mattermost_local.socket
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
      MM_SERVICESETTINGS_ENABLESECURITYFIXALERT: "false"
      MM_FILESETTINGS_MAXFILESIZE: "524288000"
      MM_TEAMSETTINGS_MAXUSERSPERTEAM: "5000"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
    volumes:
      # named volumes: no host-permission problems, identical on macOS and Linux
      - data:/mattermost/data
      - logs:/mattermost/logs
      - config:/mattermost/config
      - plugins:/mattermost/plugins
      - client-plugins:/mattermost/client/plugins

volumes:
  db:
    name: mmarchive_db
  data:
    name: mmarchive_data
  logs:
    name: mmarchive_logs
  config:
    name: mmarchive_config
  plugins:
    name: mmarchive_plugins
  client-plugins:
    name: mmarchive_client_plugins
